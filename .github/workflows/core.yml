name: Core portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cross_platform:
        description: Run Linux, macOS and Windows core checks
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      cross_platform:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Core on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # PRs use the default hosted Linux runner. Full release validation
        # opts into the two additional native compilers explicitly.
        include: ${{ fromJSON(inputs.cross_platform && '[{"platform":"linux","os":"ubuntu-24.04"},{"platform":"macos","os":"macos-15"},{"platform":"windows","os":"windows-2025"}]' || '[{"platform":"linux","os":"ubuntu-24.04"}]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      # Use each OS's default compiler/generator: GCC, AppleClang, and MSVC.
      # No SDL or ESP-IDF setup: this job verifies that the core stands alone.
      - name: Configure core only
        run: >-
          cmake -S . -B build/core-ci
          -DJELLI_BUILD_SDL=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build core and tests
        run: cmake --build build/core-ci --config Release --parallel 2
      - name: Test core
        run: ctest --test-dir build/core-ci --build-config Release --output-on-failure --no-tests=error
