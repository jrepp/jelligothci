name: Core portability

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Core on ${{ matrix.platform }}
    runs-on: ${{ ((matrix.platform == 'linux' && vars.PRIVATE_LINUX_RUNNERS == 'true') || (matrix.platform == 'macos' && vars.PRIVATE_MACOS_RUNNERS == 'true')) && fromJSON(matrix.private) || fromJSON(matrix.hosted) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            hosted: '["ubuntu-24.04"]'
            private: '["self-hosted","linux","x64","router-small"]'
          - platform: macos
            hosted: '["macos-15"]'
            private: '["self-hosted","macos","arm64","router-small"]'
          - platform: windows
            hosted: '["windows-2025"]'
            private: '["windows-2025"]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      # Use each OS's default compiler/generator: GCC, AppleClang, and MSVC.
      # No SDL or ESP-IDF setup: this job verifies that the core stands alone.
      - name: Install pinned CMake on private Linux
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          source toolchain.env
          ./scripts/uv tool install "cmake==$JELLI_CMAKE_VERSION"
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Configure core only
        run: >-
          cmake -S . -B build/core-ci
          -DJELLI_BUILD_SDL=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build core and tests
        run: cmake --build build/core-ci --config Release --parallel 2
      - name: Test core
        run: ctest --test-dir build/core-ci --build-config Release --output-on-failure --no-tests=error
