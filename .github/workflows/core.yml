name: Core portability

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Core on ${{ matrix.platform }}
    runs-on: ${{ ((matrix.platform == 'linux' && vars.PRIVATE_LINUX_RUNNERS == 'true') || (matrix.platform == 'macos' && vars.PRIVATE_MACOS_RUNNERS == 'true')) && fromJSON(matrix.private) || fromJSON(matrix.hosted) }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            hosted: '["ubuntu-latest"]'
            private: '["self-hosted","linux","x64","router-small"]'
          - platform: macos
            hosted: '["macos-latest"]'
            private: '["self-hosted","macos","arm64","router-small"]'
          - platform: windows
            hosted: '["windows-latest"]'
            private: '["windows-latest"]'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Use each OS's default compiler/generator: GCC, AppleClang, and MSVC.
      # No SDL or ESP-IDF setup: this job verifies that the core stands alone.
      - name: Configure core only
        run: >-
          cmake -S . -B build/core-ci
          -DJELLI_BUILD_SDL=OFF
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build core and tests
        run: cmake --build build/core-ci --config Release --parallel
      - name: Test core
        run: ctest --test-dir build/core-ci --build-config Release --output-on-failure --no-tests=error
