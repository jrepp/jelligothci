name: Publish engine canary
on:
  workflow_run:
    workflows: [Desktop]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  actions: read
concurrency:
  group: engine-canary-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Publish static canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/uv run --script tests/test_canary_publisher.py
          ./scripts/uv run --script scripts/publish-engine-canary.py
