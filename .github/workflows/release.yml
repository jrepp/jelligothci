name: Release validation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (defaults to this commit)
        type: string
        required: false
      publish:
        description: Attach validated source assets to an existing version release
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install SDL build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ninja-build libsdl2-dev
      - run: ./scripts/release-validate
      - run: make hooks-check
      - run: make sanitize
  source:
    needs: [core, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Package validated source
        env:
          RELEASE_REF: ${{ inputs.ref || github.sha }}
          PUBLISH: ${{ inputs.publish || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-validate --metadata-only
          version=$(cat VERSION)
          if [ "$PUBLISH" = true ]; then
            test "$RELEASE_REF" = "v$version"
            gh release view "$RELEASE_REF" > /dev/null
          fi
          mkdir -p build/release
          git archive --format=tar.gz --prefix="jelligotchi-$version/" HEAD > "build/release/jelligotchi-$version-source.tar.gz"
          (cd build/release && sha256sum ./*.tar.gz > SHA256SUMS)
          if [ "$PUBLISH" = true ]; then
            gh release upload "$RELEASE_REF" build/release/* --clobber
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validated-source
          path: build/release/*
          if-no-files-found: error
