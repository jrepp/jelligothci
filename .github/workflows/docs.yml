name: Documentation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: make docs-check
      - name: Validate release metadata and incremental version propagation
        run: |
          ./scripts/release-validate --metadata-only
          python3 tests/test_build_version.py
