name: Desktop
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install SDL build dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ninja-build libsdl2-dev
      - run: make sanitize
      - name: Test engine evidence tooling
        run: |
          ./scripts/uv run --script tests/test_engine_evidence.py
          ./scripts/uv run --script tests/test_gameplay_canary.py
      - name: Capture varied native gameplay canary
        run: ./scripts/uv run --script scripts/gameplay-canary.py --binary build/sanitize/jelli_game_preview --output build/engine-evidence
      - name: Capture SDL engine evidence
        run: ./scripts/uv run --script scripts/engine-evidence.py --binary build/sanitize/jelligotchi --output build/engine-evidence
      - name: Upload engine evidence
        id: engine-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-evidence-${{ github.sha }}
          path: build/engine-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Add engine evidence link to summary
        env:
          ARTIFACT_URL: ${{ steps.engine-evidence.outputs.artifact-url }}
        run: |
          {
            echo '## SDL engine evidence'
            echo
            echo 'The artifact includes a nine-scenario native gameplay grid, individual raw frames and state reports, plus all authored scenes at early and travel frames.'
            echo
            echo "[Download engine evidence]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
      - run: make core-test
