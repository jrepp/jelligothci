name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      studio_created: ${{ steps.release.outputs['tools/jelli-art--release_created'] }}
      studio_tag: ${{ steps.release.outputs['tools/jelli-art--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not emit normal CI events. Dispatch explicitly.
      - name: Validate release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')
          gh workflow run release.yml --ref main -f ref="$branch"
          gh workflow run jelli-art.yml --ref main -f ref="$branch"
  release:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      publish: true
  jelli-art:
    needs: prepare
    if: needs.prepare.outputs.studio_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/jelli-art.yml
    with:
      ref: ${{ needs.prepare.outputs.studio_tag }}
      publish: true
