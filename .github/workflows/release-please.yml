name: Release Please
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
concurrency:
  group: release-please
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs do not emit normal CI events. Dispatch explicitly.
      - name: Validate release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(printf '%s' "$RELEASE_PR" | jq -r '.headBranchName')
          gh workflow run release.yml --ref main -f ref="$branch"
  release:
    needs: prepare
    if: needs.prepare.outputs.created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      publish: true
