        - option "pets"
        - option "pet detail"
        - option "evolutions"
        - option "present action"
        - option "food"
      - checkbox "Ring menu open"
      - text: Ring menu open
      - checkbox "Set the clock"
      - text: Set the clock Clock time
      - textbox "Clock time" [disabled]: 09:00
      - text: Night falls from 20:00 to 06:00. Unset, the pet clock runs from content/pets.json.
    - group "Time":
      - text: Time Start at (ms)
      - spinbutton "Start at (ms)": "0"
      - text: Animation time offset of the first frame. Frames
      - spinbutton "Frames": "12"
      - text: Every (ms)
      - spinbutton "Every (ms)": "200"
      - text: Simulate first (s)
      - spinbutton "Simulate first (s)": "0"
      - text: Runs the game this many seconds before the first frame (needs decay, behaviour may change).
      - checkbox "Advance the game between frames"
      - text: Advance the game between frames
    - button "Render in engine" [disabled]
    - button "Reset scenario"
    - checkbox "Render after every save" [checked]
    - text: Render after every save
    - paragraph
