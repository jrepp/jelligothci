    - group "Needs (0–1000)":
      - text: Needs (0–1000) satiety
      - spinbutton "satiety": "700"
      - text: energy
      - spinbutton "energy": "700"
      - text: hygiene
      - spinbutton "hygiene": "700"
      - text: amusement
