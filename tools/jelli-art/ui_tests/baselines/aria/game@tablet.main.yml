- main:
  - tabpanel "Test in game":
    - status
    - heading "Test in game" [level=2]
    - text: the real C engine, from the working copy
    - alert:
      - heading "Test in game is unavailable here" [level=3]
      - paragraph: cmake is not installed here, so Test in game cannot build the engine.
      - paragraph: Install cmake and a C compiler (cc, gcc or clang) on the studio host to enable it.
    - group "Pet":
      - text: Pet Pet
      - combobox "Pet":
